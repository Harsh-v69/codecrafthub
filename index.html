<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeCraftHub: Your Learning Management Platform</title>
  <style>
    :root { --primary: #8B5CF6; --primary-dark: #7C3AED; --success: #F59E0B; --success-dark: #D97706; --danger: #EF4444; --danger-dark: #DC2626; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #f5f3ff; color: #1f2937; }
    header { background: var(--primary); color: #fff; padding: 22px 24px; text-align: center; }
    header h1 { margin: 0; font-size: 1.6rem; }
    main { max-width: 1050px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .card h2 { margin-top: 0; font-size: 1.15rem; color: var(--primary-dark); }

    form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .full { grid-column: 1 / -1; }
    label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    textarea { resize: vertical; min-height: 70px; }
    .field-error { color: var(--danger-dark); font-size: .8rem; min-height: 1em; margin-top: 2px; }

    .btn { border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; color: #fff; cursor: pointer; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-primary { background: #8B5CF6; }
    .btn-primary:hover:not(:disabled) { background: #7C3AED; }
    .btn-success { background: #F59E0B; }
    .btn-success:hover:not(:disabled) { background: #D97706; }
    .btn-danger { background: #EF4444; }
    .btn-danger:hover:not(:disabled) { background: #DC2626; }
    .btn-light { background: #e5e7eb; color: #1f2937; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #ede9fe; vertical-align: top; }
    th { font-size: .78rem; text-transform: uppercase; color: #6b7280; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; white-space: nowrap; }
    .Not-Started { background: #e5e7eb; }
    .In-Progress { background: #fef3c7; }
    .Completed { background: #ede9fe; color: #5b21b6; }
    .empty { color: #6b7280; text-align: center; padding: 22px; }

    #message { display: none; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    #message.error { display: block; background: #fee2e2; color: #991b1b; border-left: 4px solid var(--danger); }
    #message.ok { display: block; background: #fef3c7; color: #92400e; border-left: 4px solid var(--success); }

    #loading { display: none; align-items: center; gap: 10px; color: var(--primary-dark); margin-bottom: 12px; }
    #loading.active { display: flex; }
    .spinner { width: 20px; height: 20px; border: 3px solid #ddd6fe; border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    dialog { border: 0; border-radius: 10px; padding: 22px; width: min(520px, 92vw); box-shadow: 0 10px 30px rgba(0,0,0,.3); }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    dialog form { grid-template-columns: 1fr; }

    @media (max-width: 700px) {
      form { grid-template-columns: 1fr; }
      thead { display: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      tr { border: 1px solid #ede9fe; border-radius: 8px; margin-bottom: 12px; padding: 6px; }
      td { border: 0; padding: 4px 8px; }
      td::before { content: attr(data-label) ": "; font-weight: 600; color: #6b7280; }
      td.empty::before { content: ""; }
    }
  </style>
</head>
<body>
  <header><h1>CodeCraftHub: Your Learning Management Platform</h1></header>

  <main>
    <div id="message" role="alert"></div>

    <section class="card">
      <h2>Add Course</h2>
      <form id="addForm" novalidate>
        <div class="full"><label for="name">Course name *</label><input id="name"><div class="field-error" data-for="name"></div></div>
        <div class="full"><label for="description">Description *</label><textarea id="description"></textarea><div class="field-error" data-for="description"></div></div>
        <div><label for="target_date">Target date *</label><input id="target_date" type="date"><div class="field-error" data-for="target_date"></div></div>
        <div>
          <label for="status">Status *</label>
          <select id="status"><option>Not Started</option><option>In Progress</option><option>Completed</option></select>
        </div>
        <div class="full actions"><button type="submit" class="btn btn-primary" id="addBtn">Add Course</button></div>
      </form>
    </section>

    <section class="card">
      <h2>Courses</h2>
      <div id="loading"><div class="spinner"></div><span id="loadingText">Loading...</span></div>
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Target date</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody id="courseRows"></tbody>
      </table>
    </section>
  </main>

  <dialog id="editDialog">
    <h2 id="editTitle">Edit Course</h2>
    <form id="editForm" novalidate>
      <div><label for="edit_name">Course name *</label><input id="edit_name"><div class="field-error" data-for="edit_name"></div></div>
      <div><label for="edit_description">Description *</label><textarea id="edit_description"></textarea><div class="field-error" data-for="edit_description"></div></div>
      <div><label for="edit_target_date">Target date *</label><input id="edit_target_date" type="date"><div class="field-error" data-for="edit_target_date"></div></div>
      <div>
        <label for="edit_status">Status *</label>
        <select id="edit_status"><option>Not Started</option><option>In Progress</option><option>Completed</option></select>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-success" id="saveBtn">Save Changes</button>
        <button type="button" class="btn btn-light" id="cancelEdit">Cancel</button>
      </div>
    </form>
  </dialog>

  <script>
    // Node.js / Python backend: http://localhost:5000  |  Java Spring backend: http://localhost:8080
    const API = 'http://localhost:5000/api/courses';
    const $ = (id) => document.getElementById(id);
    let editingId = null;

    function showMessage(text, type) {
      const box = $('message');
      box.textContent = text;
      box.className = type;
      clearTimeout(showMessage.timer);
      if (type === 'ok') showMessage.timer = setTimeout(() => { box.className = ''; }, 3500);
    }

    function setLoading(on, text) {
      $('loading').classList.toggle('active', on);
      $('loadingText').textContent = text || 'Loading...';
    }

    async function request(url, options) {
      let res;
      try {
        res = await fetch(url, options);
      } catch {
        throw new Error('Cannot reach the server. Make sure the backend is running at ' + API);
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.message || 'Request failed (' + res.status + ')');
      return data;
    }

    // Returns the validated course body, or null after showing field errors.
    function readAndValidate(prefix) {
      const get = (f) => $(prefix + f).value.trim();
      const body = { name: get('name'), description: get('description'), target_date: get('target_date'), status: get('status') };
      const errors = {};
      if (!body.name) errors.name = 'Course name is required';
      if (!body.description) errors.description = 'Description is required';
      if (!/^\d{4}-\d{2}-\d{2}$/.test(body.target_date)) errors.target_date = 'Pick a valid target date';
      document.querySelectorAll('.field-error').forEach((el) => {
        const field = el.dataset.for;
        if (field.startsWith(prefix) && (prefix || !field.startsWith('edit_'))) {
          el.textContent = errors[field.slice(prefix.length)] || '';
        }
      });
      return Object.keys(errors).length ? null : body;
    }

    const formatDate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';

    function cell(label, content) {
      const td = document.createElement('td');
      td.dataset.label = label;
      td.append(content);
      return td;
    }

    async function loadCourses() {
      setLoading(true, 'Loading courses...');
      try {
        const courses = await request(API);
        const rows = $('courseRows');
        rows.innerHTML = '';
        if (!courses.length) {
          rows.innerHTML = '<tr><td colspan="7" class="empty">No courses yet. Add your first one above.</td></tr>';
          return;
        }
        courses.forEach((c) => {
          const tr = document.createElement('tr');
          const badge = document.createElement('span');
          badge.className = 'badge ' + c.status.replace(/ /g, '-');
          badge.textContent = c.status;
          const actions = document.createElement('div');
          actions.className = 'actions';
          const edit = document.createElement('button');
          edit.className = 'btn btn-primary';
          edit.textContent = 'Edit';
          edit.onclick = () => openEdit(c);
          const remove = document.createElement('button');
          remove.className = 'btn btn-danger';
          remove.textContent = 'Remove';
          remove.onclick = () => handleDelete(c.id, remove);
          actions.append(edit, remove);
          tr.append(
            cell('ID', String(c.id)), cell('Name', c.name), cell('Description', c.description),
            cell('Target date', c.target_date), cell('Status', badge),
            cell('Created', formatDate(c.created_at)), cell('Actions', actions)
          );
          rows.append(tr);
        });
      } catch (err) {
        showMessage(err.message, 'error');
      } finally {
        setLoading(false);
      }
    }

    $('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = readAndValidate('');
      if (!body) return;
      $('addBtn').disabled = true;
      setLoading(true, 'Saving course...');
      try {
        await request(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        showMessage('Course added successfully', 'ok');
        $('addForm').reset();
        await loadCourses();
      } catch (err) {
        showMessage(err.message, 'error');
      } finally {
        $('addBtn').disabled = false;
        setLoading(false);
      }
    });

    function openEdit(c) {
      editingId = c.id;
      $('editTitle').textContent = 'Edit Course #' + c.id;
      $('edit_name').value = c.name;
      $('edit_description').value = c.description;
      $('edit_target_date').value = c.target_date;
      $('edit_status').value = c.status;
      document.querySelectorAll('[data-for^="edit_"]').forEach((el) => { el.textContent = ''; });
      $('editDialog').showModal();
    }

    $('cancelEdit').onclick = () => $('editDialog').close();

    $('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = readAndValidate('edit_');
      if (!body) return;
      $('saveBtn').disabled = true;
      setLoading(true, 'Updating course...');
      try {
        await request(API + '/' + editingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        $('editDialog').close();
        showMessage('Course updated successfully', 'ok');
        await loadCourses();
      } catch (err) {
        showMessage(err.message, 'error');
      } finally {
        $('saveBtn').disabled = false;
        setLoading(false);
      }
    });

    async function handleDelete(id, button) {
      if (!confirm('Remove course #' + id + '?')) return;
      button.disabled = true;
      setLoading(true, 'Removing course...');
      try {
        await request(API + '/' + id, { method: 'DELETE' });
        showMessage('Course removed successfully', 'ok');
        await loadCourses();
      } catch (err) {
        button.disabled = false;
        showMessage(err.message, 'error');
      } finally {
        setLoading(false);
      }
    }

    loadCourses();
  </script>
</body>
</html>
