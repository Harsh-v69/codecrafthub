<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeCraftHub Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #f4f6fb; color: #1f2937; }
    header { background: #3730a3; color: #fff; padding: 20px 24px; }
    header h1 { margin: 0; font-size: 1.5rem; }
    header p { margin: 4px 0 0; opacity: .85; }
    main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card h2 { margin-top: 0; font-size: 1.15rem; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    form .full { grid-column: 1 / -1; }
    label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
    textarea { resize: vertical; min-height: 70px; }
    button { border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; background: #4f46e5; color: #fff; }
    button:hover { background: #4338ca; }
    button.secondary { background: #e2e8f0; color: #1f2937; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    .actions { display: flex; gap: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    th { font-size: .8rem; text-transform: uppercase; color: #64748b; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; }
    .Not-Started { background: #e2e8f0; }
    .In-Progress { background: #fef3c7; }
    .Completed { background: #dcfce7; }
    #message { display: none; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
    #message.error { display: block; background: #fee2e2; color: #991b1b; }
    #message.ok { display: block; background: #dcfce7; color: #166534; }
    .empty { color: #64748b; text-align: center; padding: 20px; }
    @media (max-width: 640px) { form { grid-template-columns: 1fr; } th:nth-child(2), td:nth-child(2) { display: none; } }
  </style>
</head>
<body>
  <header>
    <h1>CodeCraftHub Dashboard</h1>
    <p>Manage the course listings of your personalized learning platform</p>
  </header>

  <main>
    <div id="message" role="alert"></div>

    <section class="card">
      <h2 id="formTitle">Add a course</h2>
      <form id="courseForm">
        <div class="full"><label for="name">Course name</label><input id="name" required></div>
        <div class="full"><label for="description">Description</label><textarea id="description" required></textarea></div>
        <div><label for="target_date">Target date</label><input id="target_date" type="date" required></div>
        <div>
          <label for="status">Status</label>
          <select id="status">
            <option>Not Started</option><option>In Progress</option><option>Completed</option>
          </select>
        </div>
        <div class="full actions">
          <button type="submit" id="saveBtn">Add course</button>
          <button type="button" class="secondary" id="cancelBtn" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Courses</h2>
      <table>
        <thead><tr><th>Name</th><th>Description</th><th>Target date</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="courseRows"></tbody>
      </table>
    </section>
  </main>

  <script>
    // Backend base URL (start it with: npm start)
    const API = 'http://localhost:5000/api/courses';
    const form = document.getElementById('courseForm');
    const rows = document.getElementById('courseRows');
    const message = document.getElementById('message');
    let editingId = null;

    function show(text, type) {
      message.textContent = text;
      message.className = type;
      if (type === 'ok') setTimeout(() => { message.className = ''; }, 3000);
    }

    async function request(url, options) {
      let res;
      try {
        res = await fetch(url, options);
      } catch {
        throw new Error('Cannot reach the API. Is the backend running at ' + API + ' ?');
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed (' + res.status + ')');
      return data;
    }

    function cell(text) {
      const td = document.createElement('td');
      td.textContent = text;
      return td;
    }

    async function loadCourses() {
      try {
        const courses = await request(API);
        rows.innerHTML = '';
        if (!courses.length) {
          rows.innerHTML = '<tr><td colspan="5" class="empty">No courses yet. Add your first one above.</td></tr>';
          return;
        }
        courses.forEach((c) => {
          const tr = document.createElement('tr');
          tr.append(cell(c.name), cell(c.description), cell(c.target_date));
          const statusTd = document.createElement('td');
          const badge = document.createElement('span');
          badge.className = 'badge ' + c.status.replace(/ /g, '-');
          badge.textContent = c.status;
          statusTd.append(badge);
          const actionsTd = document.createElement('td');
          const box = document.createElement('div');
          box.className = 'actions';
          const edit = document.createElement('button');
          edit.textContent = 'Edit';
          edit.className = 'secondary';
          edit.onclick = () => startEdit(c);
          const del = document.createElement('button');
          del.textContent = 'Delete';
          del.className = 'danger';
          del.onclick = () => removeCourse(c);
          box.append(edit, del);
          actionsTd.append(box);
          tr.append(statusTd, actionsTd);
          rows.append(tr);
        });
      } catch (err) {
        show(err.message, 'error');
      }
    }

    function resetForm() {
      editingId = null;
      form.reset();
      document.getElementById('formTitle').textContent = 'Add a course';
      document.getElementById('saveBtn').textContent = 'Add course';
      document.getElementById('cancelBtn').hidden = true;
    }

    function startEdit(c) {
      editingId = c.id;
      document.getElementById('name').value = c.name;
      document.getElementById('description').value = c.description;
      document.getElementById('target_date').value = c.target_date;
      document.getElementById('status').value = c.status;
      document.getElementById('formTitle').textContent = 'Edit course #' + c.id;
      document.getElementById('saveBtn').textContent = 'Save changes';
      document.getElementById('cancelBtn').hidden = false;
      form.scrollIntoView({ behavior: 'smooth' });
    }

    async function removeCourse(c) {
      if (!confirm('Delete "' + c.name + '"?')) return;
      try {
        await request(API + '/' + c.id, { method: 'DELETE' });
        show('Course deleted', 'ok');
        if (editingId === c.id) resetForm();
        loadCourses();
      } catch (err) {
        show(err.message, 'error');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name: document.getElementById('name').value,
        description: document.getElementById('description').value,
        target_date: document.getElementById('target_date').value,
        status: document.getElementById('status').value,
      };
      try {
        await request(editingId ? API + '/' + editingId : API, {
          method: editingId ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        show(editingId ? 'Course updated' : 'Course added', 'ok');
        resetForm();
        loadCourses();
      } catch (err) {
        show(err.message, 'error');
      }
    });

    document.getElementById('cancelBtn').onclick = resetForm;
    loadCourses();
  </script>
</body>
</html>
